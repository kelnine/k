[project]
name = "kterminal"
version = "0.1.0"
description = "K Terminal — modular algorithmic trading terminal (strategy research, paper/forward testing, TradingView signals, Telegram, broker execution)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1",
    "typer>=0.12",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
kterminal = "kterminal.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kterminal"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # naming
    "S",             # bandit (security)
    "SIM", "C4", "PERF", "RUF",
    "ASYNC",         # async pitfalls
    "DTZ",           # no naive datetimes — every timestamp is timezone-aware UTC
    "PT",            # pytest style
    "T20",           # no stray print() — use the logger
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy secrets are fine in tests
"src/kterminal/cli.py" = ["T20"]       # the CLI prints to the terminal by design

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["kterminal"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL (set KT_TEST_DATABASE_URL); skipped otherwise",
]
filterwarnings = ["error::DeprecationWarning:kterminal.*"]

# ── import-linter: the architecture, enforced ────────────────────────────────
# See docs/01-architecture.md "Allowed dependencies". CI fails on any violation.
[tool.importlinter]
root_package = "kterminal"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture (higher layers may import lower ones, never the reverse)"
type = "layers"
layers = [
    "kterminal.cli",
    "kterminal.runtime",
    "kterminal.api",
    "kterminal.webhook | kterminal.paper | kterminal.backtest | kterminal.notifications",
    "kterminal.execution | kterminal.analytics",
    "kterminal.risk | kterminal.brokers | kterminal.strategies",
    "kterminal.strategy_engine | kterminal.marketdata | kterminal.indicators",
    "kterminal.db",
    "kterminal.observability",
    "kterminal.config",
    "kterminal.core",
]

[[tool.importlinter.contracts]]
name = "Strategies are sandboxed: they cannot touch accounts, orders, brokers or storage"
type = "forbidden"
source_modules = ["kterminal.strategies"]
forbidden_modules = [
    "kterminal.api",
    "kterminal.backtest",
    "kterminal.brokers",
    "kterminal.db",
    "kterminal.execution",
    "kterminal.notifications",
    "kterminal.paper",
    "kterminal.risk",
    "kterminal.runtime",
    "kterminal.webhook",
]

[[tool.importlinter.contracts]]
name = "The risk engine is pure and cannot be bypassed from inside"
type = "forbidden"
source_modules = ["kterminal.risk"]
forbidden_modules = [
    "kterminal.api",
    "kterminal.backtest",
    "kterminal.brokers",
    "kterminal.execution",
    "kterminal.notifications",
    "kterminal.paper",
    "kterminal.strategies",
    "kterminal.webhook",
]

[[tool.importlinter.contracts]]
name = "Only the execution layer (and the wiring that builds it) may import broker adapters"
type = "forbidden"
source_modules = [
    "kterminal.analytics",
    "kterminal.api",
    "kterminal.marketdata",
    "kterminal.notifications",
    "kterminal.risk",
    "kterminal.strategies",
    "kterminal.strategy_engine",
    "kterminal.webhook",
]
forbidden_modules = ["kterminal.brokers"]
