# Bybit v5 category=linear (USDT perpetuals): quantity in base units
# (contract_size 1). Specs from GET /v5/market/instruments-info?category=linear
# (priceFilter.tickSize, lotSizeFilter.minOrderQty / qtyStep / maxOrderQty /
# minNotionalValue, fundingInterval in MINUTES).
#
# Verified rows: BTCUSDT from the ccxt fixture and Bybit's own docs example;
# XAUUSDT, XAGUSDT, EURUSDUSDT and GBPUSDUSDT from a verbatim instruments-info
# capture dated 2026-10-01 (verify pass). SOLUSDT comes from a single
# third-party spec page (research medium; the verify pass could not confirm it
# but did not dispute it) — re-sync it first.
#
# Funding: per symbol and dynamic since late 2025 (8 h -> 4/2/1 h while the
# rate is capped); read fundingInterval and tickers.fundingIntervalHour. The
# crypto_perp_bybit profile assumes 8 h at 00/08/16 UTC and non-VIP fees of
# 0.02 % maker / 0.055 % taker (ASSUMPTIONS).
#
# Rows marked "spec unverified" carry PLACEHOLDER numbers (tick = canonical
# tick, min/step = 1) and are tradable: false.
# Not aliased: XAUTUSDT (a Tether Gold TOKEN perp — different underlying);
# PUMPUSDT (Bybit names the pump.fun token PUMPFUN; PUMP may be PumpBTC).

venue: bybit_linear

listings:
  # ── crypto ─────────────────────────────────────────────────────────────────
  - instrument: BTCUSD
    venue_symbol: BTCUSDT
    contract_type: PERPETUAL
    tick_size: "0.1"
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "0.001"
    qty_step: "0.001"
    min_notional: "5"
    quote_currency: USDT
    cost_profile: crypto_perp_bybit
    verified_on: "2026-10-06"
    source: https://raw.githubusercontent.com/bybit-exchange/docs/master/docs/v5/market/instrument.mdx
    notes: >-
      LinearPerpetual, settleCoin USDT, tick 0.10, qty 0.001, minNotionalValue
      5 USDT; maxOrderQty ~1,190-1,500 and maxMktOrderQty ~150-500 depending on
      snapshot; max leverage 100; fundingInterval 480 min; funding cap
      +/-0.375 % to +/-0.5 % by snapshot. Bybit SPOT BTCUSDT is a different
      product (tick 0.1).

  - instrument: SOLUSD
    venue_symbol: SOLUSDT
    contract_type: PERPETUAL
    tick_size: "0.01"
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "0.1"
    qty_step: "0.1"
    quote_currency: USDT
    cost_profile: crypto_perp_bybit
    verified_on: "2026-10-06"
    source: https://www.tv-hub.org/tradingview-to-bybit/solusdt
    notes: >-
      tick 0.01, minOrderQty 0.1 SOL, qtyStep 0.1, max leverage 100 per a
      third-party spec page (single source; not confirmed against Bybit by the
      verify pass) — re-sync from instruments-info before relying on it.
      minNotionalValue is likely 5 USDT as for other linear contracts but
      unconfirmed, so it is not set.

