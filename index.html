<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Financial Terminal — Market Dashboard</title>
<style>
  :root{
    --bg:#0A0A0A; --card:#141414; --border:#232323;
    --green:#00C896; --red:#FF5252; --yellow:#FFC107;
    --text:#E8E8E8; --muted:#8A8A8A;
    --mono:"JetBrains Mono","SF Mono","Fira Code",Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;}
  a{color:inherit;text-decoration:none;}

  header{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:rgba(10,10,10,.95);backdrop-filter:blur(6px);z-index:10;
  }
  .brand{font-size:15px;font-weight:700;letter-spacing:2px;}
  .brand span{color:var(--green);}
  .clock{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);}
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot.open{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
  .dot.closed{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--border);font-size:12px;}
  nav a{padding:7px 14px;border-radius:6px;color:var(--muted);border:1px solid transparent;}
  nav a:hover{color:var(--text);border-color:var(--border);}
  nav a.active{color:var(--green);border-color:var(--green);background:rgba(0,200,150,.07);}

  main{max-width:1280px;margin:0 auto;padding:24px;}
  h1{font-size:18px;margin-bottom:4px;}
  .subtitle{color:var(--muted);font-size:12px;margin-bottom:24px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;
    transition:border-color .2s, transform .2s;
  }
  .card:hover{border-color:#3a3a3a;transform:translateY(-2px);}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .idx-name{font-size:13px;font-weight:700;}
  .idx-region{font-size:10px;color:var(--muted);letter-spacing:1px;}
  .price{font-size:24px;font-weight:700;margin:8px 0 4px;}
  .change{font-size:13px;display:flex;gap:10px;align-items:center;}
  .up{color:var(--green);} .down{color:var(--red);}
  .arrow{font-size:14px;}
  canvas.spark{width:100%;height:46px;margin-top:12px;}
  .sessions{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px;}

  footer{max-width:1280px;margin:0 auto;padding:24px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);margin-top:32px;}
  .refresh-note{display:inline-flex;align-items:center;gap:6px;}
  .refresh-note .dot{background:var(--green);animation:pulse 2s infinite;}

  @media(max-width:600px){
    header{padding:12px 16px;} main{padding:16px;}
    .grid{grid-template-columns:1fr;}
    .clock{font-size:10px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">AI <span>FINANCIAL</span> TERMINAL</div>
  <div class="clock">
    <span id="fecha"></span>
    <span id="hora"></span>
    <span class="status"><span id="statusDot" class="dot closed"></span><span id="statusTxt">MARKET CLOSED</span></span>
  </div>
</header>

<nav>
  <a href="index.html" class="active">📊 Dashboard</a>
  <a href="analyzer.html">🔎 Stock Analyzer</a>
  <a href="macro.html">🌍 Macroeconomics</a>
  <a href="portfolio.html">💼 My Portfolio</a>
</nav>

<main>
  <h1>Market Dashboard</h1>
  <p class="subtitle">Major indices · simulated data for demo purposes · auto-refresh every 30 s</p>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span class="refresh-note"><span class="dot"></span>Last update: <span id="lastUpdate">—</span></span><br><br>
  All data shown is simulated and does not constitute financial advice.
</footer>

<script>
// ---------- Base indices ----------
const INDICES = [
  {sym:"SPX",  name:"S&P 500",            region:"USA",     base:5612.40, dec:2},
  {sym:"IXIC", name:"NASDAQ Composite",   region:"USA",     base:18421.75,dec:2},
  {sym:"DJI",  name:"Dow Jones Industrial",region:"USA",    base:41338.20,dec:2},
  {sym:"RUT",  name:"Russell 2000",       region:"USA",     base:2218.65, dec:2},
  {sym:"VIX",  name:"VIX (Volatility)",   region:"CBOE",    base:15.84,  dec:2, inverse:true},
  {sym:"FTSE", name:"FTSE 100",           region:"UK",      base:8392.10, dec:2},
  {sym:"DAX",  name:"DAX",                region:"GERMANY", base:19874.55,dec:2},
  {sym:"N225", name:"Nikkei 225",         region:"JAPAN",   base:39102.30,dec:2},
];

// Seeded RNG so the "5 sessions" stay stable during the visit
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const state = INDICES.map((idx,i)=>{
  const rnd = mulberry32(0xC0FFEE + i*7919);
  // 5 previous sessions + current price (random walk)
  const hist = [idx.base];
  for(let s=0;s<5;s++) hist.unshift(hist[0] * (1 - (rnd()-0.5)*0.022));
  return {...idx, hist, price: idx.base, prevClose: hist[hist.length-2]};
});

const fmt = (n,d)=> n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  state.forEach(s=>{
    const chg = s.price - s.prevClose;
    const pct = chg / s.prevClose * 100;
    const upGood = s.inverse ? chg<0 : chg>=0;
    const cls = upGood ? "up":"down";
    const arrow = chg>=0 ? "▲":"▼";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top"><span class="idx-name">${s.name}</span><span class="idx-region">${s.region}</span></div>
      <div class="idx-region">${s.sym}</div>
      <div class="price">${fmt(s.price,s.dec)}</div>
      <div class="change ${cls}">
        <span class="arrow">${arrow}</span>
        <span>${chg>=0?"+":""}${fmt(chg,s.dec)}</span>
        <span>(${pct>=0?"+":""}${fmt(pct,2)} %)</span>
      </div>
      <canvas class="spark" width="280" height="46"></canvas>
      <div class="sessions"><span>-5d</span><span>-4d</span><span>-3d</span><span>-2d</span><span>-1d</span><span>today</span></div>`;
    grid.appendChild(card);
    drawSpark(card.querySelector("canvas"), [...s.hist.slice(0,5), s.price], upGood);
  });
  document.getElementById("lastUpdate").textContent = new Date().toLocaleTimeString("en-US");
}

function drawSpark(cv, data, up){
  const ctx = cv.getContext("2d");
  const W=cv.width, H=cv.height, pad=4;
  ctx.clearRect(0,0,W,H);
  const min=Math.min(...data), max=Math.max(...data), span=(max-min)||1;
  const X=i=> pad + i*(W-2*pad)/(data.length-1);
  const Y=v=> H-pad - (v-min)/span*(H-2*pad);
  const col = up ? "#00C896" : "#FF5252";
  // area
  ctx.beginPath(); ctx.moveTo(X(0),Y(data[0]));
  data.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.lineTo(X(data.length-1),H); ctx.lineTo(X(0),H); ctx.closePath();
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, col+"44"); g.addColorStop(1, col+"00");
  ctx.fillStyle=g; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(X(0),Y(data[0]));
  data.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke();
  // last point
  ctx.beginPath(); ctx.arc(X(data.length-1),Y(data[data.length-1]),2.6,0,7);
  ctx.fillStyle=col; ctx.fill();
}

// ---------- Clock and market status (NYSE, Eastern Time) ----------
function tick(){
  const now = new Date();
  document.getElementById("fecha").textContent =
    now.toLocaleDateString("en-US",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
  document.getElementById("hora").textContent = now.toLocaleTimeString("en-US");
  let open = false;
  try{
    const et = new Date(now.toLocaleString("en-US",{timeZone:"America/New_York"}));
    const mins = et.getHours()*60 + et.getMinutes();
    const weekday = et.getDay();
    open = weekday>=1 && weekday<=5 && mins>=570 && mins<960; // 09:30–16:00 ET
  }catch(e){}
  document.getElementById("statusDot").className = "dot " + (open?"open":"closed");
  document.getElementById("statusTxt").textContent = open ? "MARKET OPEN" : "MARKET CLOSED";
}

// ---------- Simulated refresh every 30 s ----------
function refresh(){
  state.forEach(s=>{
    const vol = s.sym==="VIX" ? 0.012 : 0.0035;
    s.price = +(s.price * (1 + (Math.random()-0.5)*vol)).toFixed(s.dec);
  });
  render();
}

tick(); setInterval(tick,1000);
render(); setInterval(refresh,30000);
</script>
</body>
</html>
