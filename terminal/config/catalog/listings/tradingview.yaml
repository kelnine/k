# TradingView data/alert symbols — DATA ONLY (every row is tradable: false).
#
# One listing per instrument (a listing is keyed venue:instrument), chosen as
# the feed strategy-lab accounts take bars from (venue_profiles.yaml "data").
# Other TradingView feeds of the same instrument resolve without a listing:
# the EXCHANGE: prefix and .P suffix are stripped and the remainder matches a
# global alias (PEPPERSTONE:NAS100 -> NAS100, BYBIT:PUMPFUNUSDT.P -> PUMPUSD);
# feeds that would not resolve that way are source aliases in instruments.yaml
# (TVC:NDQ, FOREXCOM:NSXUSD …).
#
# Feed choice (research 2026-10-06):
#   * CFD-type instruments use OANDA's feeds (one consistent broker family with
#     ~23 h CFD sessions; NASDAQ:NDX / DJ:DJI / SP:SPX cash indices update only
#     09:30-16:00 New York and have no overnight bars). They are PROXIES for a
#     prop-firm server's own prices: the basis, digits and session template
#     differ slightly by broker. Broker CFD charts are believed to be built from
#     one side of the quote with tick volume only, so the cost layer adds the
#     spread explicitly.
#   * Futures use the CME_MINI continuous front month (1!), which switches on a
#     volume crossover (~8 days before expiry) and is NOT back-adjusted by
#     default. symbol_format renders the dated contract (CME_MINI:MNQZ2026).
#   * Crypto uses the feed of the venue the lab executes on where possible
#     (USDT/USDC-quoted; USDT = USD is an explicit, recorded assumption).
#
# Specs on data listings are informational — never used for money math. Ticks
# follow the source venue; contract_size is TradingView's pointvalue (1 for CFD
# and crypto feeds, the multiplier for futures); min_qty/qty_step are
# placeholders ("1") because a data feed has no order size. No verified_on.

venue: tradingview

listings:
  # ── metals ─────────────────────────────────────────────────────────────────
  - instrument: XAUUSD
    venue_symbol: "OANDA:XAUUSD"
    contract_type: CFD
    tradable: false
    tick_size: "0.001"        # OANDA 3-decimal gold pricing
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "1"              # placeholder (data only)
    qty_step: "1"             # placeholder (data only)
    quote_currency: USD
    source: https://developer.oanda.com/rest-live-v20/instrument-df/
    notes: >-
      OANDA gold CFD feed (same quotes as v20 XAU_USD). Proxy for prop-server
      gold. TVC:GOLD / FX_IDC:XAUUSD are composite/indicative series (resolve
      here via aliases) and are never fill prices. Pine pointvalue 1 (100 qty =
      1 standard CFD lot) is believed correct but unverified.

  - instrument: XAGUSD
    venue_symbol: "OANDA:XAGUSD"
    contract_type: CFD
    tradable: false
    tick_size: "0.00001"      # assumed to follow OANDA's 5-decimal silver pricing (syminfo.mintick unverified)
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "1"              # placeholder (data only)
    qty_step: "1"             # placeholder (data only)
    quote_currency: USD
    source: https://developer.oanda.com/rest-live-v20/instrument-df/
    notes: >-
      OANDA silver CFD feed. Tick assumed from OANDA's displayPrecision 5;
      confirm syminfo.mintick. TVC:SILVER is a composite data series.

