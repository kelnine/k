# Binance USDⓈ-M perpetuals (fapi.binance.com): USDT-margined, quantity in
# base units (contract_size 1). Filters from GET /fapi/v1/exchangeInfo:
# PRICE_FILTER.tickSize, LOT_SIZE.minQty/stepSize/maxQty, MARKET_LOT_SIZE,
# MIN_NOTIONAL.notional. Verified rows come from raw exchangeInfo captures
# (ccxt fixture; a verbatim XAUUSDT row in darkcite/trading-engine-multivenue),
# confirmed by the verify pass.
#
# Funding: the interval is PER SYMBOL. GET /fapi/v1/fundingInfo returns only
# symbols with an adjusted cap/floor/interval; a symbol absent from it is on
# the default 8 h schedule (00/08/16 UTC). The crypto_perp_binance profile
# assumes 8 h; listings known to settle more often say so in their notes.
#
# Fees (assumption, crypto_perp_binance): VIP0 maker 0.02 % / taker 0.05 %
# (10 % less in BNB).
#
# Rows marked "spec unverified" carry PLACEHOLDER numbers (tick = canonical
# tick, min/step = 1) and are tradable: false.

venue: binance_usdm

listings:
  # ── crypto ─────────────────────────────────────────────────────────────────
  - instrument: BTCUSD
    venue_symbol: BTCUSDT
    contract_type: PERPETUAL
    tick_size: "0.1"
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "0.001"
    qty_step: "0.001"
    max_qty: "1000"
    min_notional: "50"
    quote_currency: USDT
    cost_profile: crypto_perp_binance
    verified_on: "2026-10-06"
    source: https://raw.githubusercontent.com/ccxt/ccxt/master/ts/src/test/static/markets/binance.json
    notes: >-
      PRICE_FILTER 0.10; LOT_SIZE 0.001 (max 1000); MARKET_LOT_SIZE max 120;
      MIN_NOTIONAL 50 USDT (reported history: 5 -> 100 on 2023-11-02 -> 50 on
      2026-04-14; dates unverified); PERCENT_PRICE 0.95-1.05. Funding on the
      default 8 h schedule unless listed in fundingInfo. BTCUSDC perps and
      quarterly BTCUSDT_YYMMDD futures are separate products.

  - instrument: SOLUSD
    venue_symbol: SOLUSDT
    contract_type: PERPETUAL
    tradable: false
    tick_size: "0.01"          # research (medium): 0.01 since 2024-10-14; a 2026 change back to 0.001 was rumoured
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "1"               # placeholder
    qty_step: "1"              # placeholder
    quote_currency: USDT
    cost_profile: crypto_perp_binance
    source: https://www.binance.com/en/support/announcement/updates-on-tick-size-for-sol-usd%E2%93%A2-m-and-coin-m-futures-contracts-2024-10-14-8bfe2e9b86734cd08f3cbcdb82b79f51
    notes: >-
      spec unverified — enable after syncing from the venue API
      (/fapi/v1/exchangeInfo): LOT_SIZE and MIN_NOTIONAL were not verifiable.
      Tick history 0.01 -> 0.001 (2022-11) -> 0.01 (2024-10-14).

  - instrument: NEARUSD
    venue_symbol: NEARUSDT
    contract_type: PERPETUAL
    tradable: false
    tick_size: "0.00001"       # placeholder
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "1"               # placeholder
    qty_step: "1"              # placeholder
    quote_currency: USDT
    cost_profile: crypto_perp_binance
    notes: >-
      spec unverified — enable after syncing from the venue API. Funding
