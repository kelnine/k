    qty_step: "1"             # placeholder (data only)
    quote_currency: USD
    source: https://www.tradingview.com/symbols/OANDA-NAS100USD/
    notes: >-
      OANDA US Nas 100 CFD feed (v20 NAS100_USD, 1 decimal, tick volume only),
      ~23 h a day. NASDAQ:NDX (official cash index, RTH only, no volume) and
      CME_MINI:NQ1! (futures = cash + basis) are different series: never mix
      feeds within one lab comparison.

