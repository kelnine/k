# S8 · Combined SMC Suite (script 4), PSAR section — 200 EMA filtered Parabolic SAR.
# Strategy: backend/src/kterminal/strategies/psar_ema200 (README there).
#
# Doc 13 decisions applied (defaults, the user did not answer):
#   D3  fill at the next open; skip the entry when that open is already past the stop
#   D4  script 4: stop and reverse on the flip (reverse only when the new side's
#       filters pass, as the script does; otherwise flat)
#   D5  main: exit/reverse on the closed-candle flip, protective stop fixed at the
#       SAR printed on the signal bar; variant: stop trailed every bar on the
#       projected SAR (MOVE_SL, never widening)
#   D10 15m, plus a 5m variant, all 14 instruments, one Paper 50K account per variant
#       and timeframe, one position per instrument (max_open_positions: 14)
#   D12 the PSAR + channel confluence alert stays levels-only (not run)
#   D13 script defaults
