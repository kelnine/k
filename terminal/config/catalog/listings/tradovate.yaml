# Tradovate — CME futures through Tradovate (also the platform behind many
# futures prop firms). Contract specs are CME's (see cme.yaml).
#
# Contract names are [root][month code][1-digit year] (MNQZ6 = Dec 2026,
# MNQH7 = Mar 2027); REST lookup contract/find?name=MNQZ6. Orders and
# positions carry a numeric contractId that must be resolved back to the name.
# Tradovate's TradingView integration also accepts MNQ1!.
#
# Commission is plan-dependent (secondary sources: micros ~$0.35 / $0.25 /
# $0.09 per side on Free / Monthly / Lifetime, plus exchange, clearing and NFA
# fees; ~$0.66/side all-in reported for MNQ) — not verified on Tradovate's own
# pages. Prop firms on Tradovate set their own fees.

venue: tradovate

listings:
  - instrument: MNQ
    venue_symbol: MNQ
    contract_type: FUTURE
    tick_size: "0.25"
    contract_size: "2"
    quantity_unit: CONTRACTS
    min_qty: "1"
    qty_step: "1"
    quote_currency: USD
    cost_profile: cme_micro_equity
    symbol_format: "{root}{code}{y1}"
    verified_on: "2026-10-06"
    source: https://crosstrade.io/docs/api/tradovate/find-contract
    notes: >-
      Dated contract name MNQZ6 (1-digit year); orders reference a numeric
      contractId.

  - instrument: NQ
    venue_symbol: NQ
    contract_type: FUTURE
    tick_size: "0.25"
    contract_size: "20"
    quantity_unit: CONTRACTS
    min_qty: "1"
    qty_step: "1"
    quote_currency: USD
    cost_profile: cme_emini_equity   # E-mini fees (see cme.yaml)
    symbol_format: "{root}{code}{y1}"
    verified_on: "2026-10-06"
    source: https://crosstrade.io/docs/api/tradovate/find-contract
    notes: >-
      Dated contract name NQZ6.
