    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "1"                # placeholder
    qty_step: "1"               # placeholder
    quote_currency: USD
    source: https://www.fxstreet.com/cryptocurrencies/news/coinbase-pro-adds-zec-usd-bat-usd-and-dai-usd-202005010346
