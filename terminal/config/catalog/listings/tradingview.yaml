  # ── FX ─────────────────────────────────────────────────────────────────────
  - instrument: EURUSD
    venue_symbol: "OANDA:EURUSD"
    contract_type: CFD
    tradable: false
    tick_size: "0.00001"
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "1"              # placeholder (data only)
    qty_step: "1"             # placeholder (data only)
    quote_currency: USD
    source: https://developer.oanda.com/rest-live-v20/instrument-df/
    notes: >-
      OANDA EUR/USD feed (5-digit pricing), chosen to match the other OANDA
      feeds. FX:EURUSD (FXCM), FX_IDC:, PEPPERSTONE:, FOREXCOM: feeds differ
      slightly; pin one per strategy instance. CME:6E1! is a futures symbol
