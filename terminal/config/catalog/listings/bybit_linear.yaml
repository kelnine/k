  # ── TradFi perpetuals: metals ──────────────────────────────────────────────
  # One-time /v5/user/agreement required. Trading hours (24/7 vs 24/5) are
  # unverified, so the instrument's metals_otc calendar applies. Bybit's
  # commodity perps reportedly have lower fees (maker 0 % / taker 0.0275 %,
  # June 2026 announcement, secondary) than the profile assumes, and fund every
  # 4 h (fundingInterval 240) rather than the profile's 8 h.
  - instrument: XAUUSD
    venue_symbol: XAUUSDT
    contract_type: PERPETUAL
    tick_size: "0.01"
    contract_size: "1"          # baseCoin XAU: 1 troy oz per 1.0 qty
    quantity_unit: BASE_UNITS
    min_qty: "0.001"
    qty_step: "0.001"
    max_qty: "500"
    min_notional: "5"
    quote_currency: USDT
    cost_profile: crypto_perp_bybit
    verified_on: "2026-10-06"
    source: https://announcements.bybit.com/en/article/new-listing-xauusdt-perpetual-contract-with-up-to-75x-leverage-blt7475343901d47b34/
    notes: >-
