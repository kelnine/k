  - instrument: PUMPUSD
    venue_symbol: PUMPUSDT
    contract_type: PERPETUAL
    tradable: false
    tick_size: "0.0000001"     # placeholder
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "1"               # placeholder
    qty_step: "1"              # placeholder
    quote_currency: USDT
    cost_profile: crypto_perp_binance
    source: https://www.theblock.co/post/361975/pump-token-ico
    notes: >-
      spec unverified — enable after syncing from the venue API. Started as a
      pre-market perp ~2025-07-10, converted after spot launched. Confirm the
      underlying is pump.fun (an April 2025 PUMPUSDT likely referred to
      PumpBTC) and whether the symbol carries a 1000 prefix (1000PUMPUSDT).

  # ── TradFi perpetuals (metals) ─────────────────────────────────────────────
  # contractType TRADIFI_PERPETUAL, issued by Nest Exchange Ltd (ADGM FSRA);
  # needs a TradFi-perps agreement and is restricted in some jurisdictions.
  # Since 2026-09-15 reportedly 24/5 (halt Fri 21:00 UTC -> Sun 21:00 UTC, no
  # trading/liquidations/funding during the halt; UNVERIFIED, and whether the
  # halt follows US DST is unknown). No calendar in sessions.yaml matches, so
  # these rows keep the instrument's metals_otc calendar.
  - instrument: XAUUSD
    venue_symbol: XAUUSDT
    contract_type: PERPETUAL
    tick_size: "0.01"
    contract_size: "1"          # 1 troy oz per 1.0 qty
    quantity_unit: BASE_UNITS
    min_qty: "0.001"
    qty_step: "0.001"
    max_qty: "10000"
    min_notional: "5"
    quote_currency: USDT
    cost_profile: crypto_perp_binance
    verified_on: "2026-10-06"
    source: https://www.binance.info/en/futures/XAUUSDT
    notes: >-
      Verbatim exchangeInfo row: TRADIFI_PERPETUAL, baseAsset XAU, tick 0.01,
      LOT_SIZE 0.001 (max 10,000), MARKET_LOT_SIZE max 1,000, MIN_NOTIONAL 5,
      PERCENT_PRICE +/-2 %. Trading since 2025-12-11 08:05 UTC (onboardDate).
      FUNDING settled every 4 h (00/04/08/12/16/20 UTC, weekends included)
      from 2026-05-22 to 2026-08-13 — NOT the 8 h the cost profile assumes;
      cap/floor +/-0.5 % per interval (2026-09-15 capture). Read
      fundingIntervalHours live. USDT basis and funding vs spot XAUUSD.

  - instrument: XAGUSD
    venue_symbol: XAGUSDT
    contract_type: PERPETUAL
    tradable: false
    tick_size: "0.01"           # research (medium); no exchangeInfo capture found
    contract_size: "1"          # 1 troy oz per 1.0 qty
    quantity_unit: BASE_UNITS
    min_qty: "0.001"            # research (medium)
    qty_step: "0.001"           # placeholder — LOT_SIZE step unverified
    quote_currency: USDT
    cost_profile: crypto_perp_binance
    source: https://www.cryptopolitan.com/binance-silver-xagusdt-perp-contract/
    notes: >-
      spec unverified — enable after syncing from the venue API (no XAGUSDT
      exchangeInfo or fundingRate capture was found). Launched 2026-01-07 as a
      TradFi perp; min notional 5 USDT reported. The 0.01 tick is coarse next
      to a CFD's 0.001.
