  # ── trade.xyz HIP-3 markets (dex 'xyz') ────────────────────────────────────
  # Coin names carry the 'xyz:' prefix. Sessions: external session Sun 18:00
  # -> Fri 17:00 New York for metals (Sun 17:00 for FX), daily maintenance
  # 17:00-18:00 New York Mon-Thu, plus CME holiday closures (internal pricing
  # covers weekends) — the instruments' metals_otc / fx_otc calendars apply.
  - instrument: XAUUSD
    venue_symbol: "xyz:GOLD"
    contract_type: PERPETUAL
    tick_size: "0.1"            # effective tick at ~$4,186 (5 significant figures)
    contract_size: "1"          # 1 troy oz per 1.0 size unit
    quantity_unit: BASE_UNITS
    min_qty: "0.0001"
    qty_step: "0.0001"          # szDecimals 4
    min_notional: "10"
    quote_currency: USDC
    cost_profile: crypto_perp_hyperliquid
    verified_on: "2026-10-06"
    source: https://docs.trade.xyz/xyz-perps-specification
    notes: >-
      Live xyz meta: szDecimals 4, maxLeverage 25, NO growth mode (gold is
      excluded), so real fees are standard HIP-3 = 2x core (~0.03 % / 0.09 %):
      the cost profile UNDERSTATES them by half. Funding hourly, 0.5x scaling,
      cap +/-4 %/h. Oracle Pyth XAU/USD; OI cap $500m; docs say Normal
      Isolated margin.

