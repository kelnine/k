# OKX USDT-margined perpetual swaps. Orders are sized in CONTRACTS: one
# contract = ctVal base units, so contract_size = ctVal and
# P&L = Δprice × contracts × ctVal. ctVal varies by orders of magnitude
# (BTC 0.01, ETH 0.1, LTC 1, ADA/XRP 100, DOGE/TRX 1000): sizing without the
# venue's ctVal is wrong by 10-1000x. Specs from
# GET /api/v5/public/instruments?instType=SWAP (ctVal, ctValCcy, tickSz, lotSz,
# minSz); funding from /api/v5/public/funding-rate.
#
# Verified rows: BTC from the ccxt fixture (also nautilus_trader test data and
# OKX's agent-trade-kit); XAU and XAG from OKX production fixtures supplied by
# the verify pass. Funding defaults to 8 h at 00/08/16 UTC and can step down
# (4/2/1 h) while capped.
#
# No OKX profile exists in costs.yaml: crypto_perp_binance is the closest
# (same 0.02 % maker / 0.05 % taker regular-tier swap fees and 8 h funding at
# 00/08/16 UTC) — an assumption.
#
# Rows marked "spec unverified" carry PLACEHOLDER numbers — including
# contract_size, which stands in for an UNKNOWN ctVal — and are tradable: false.

venue: okx_swap

listings:
  - instrument: BTCUSD
    venue_symbol: BTC-USDT-SWAP
    contract_type: PERPETUAL
    tick_size: "0.1"
    contract_size: "0.01"       # ctVal 0.01 BTC per contract
    quantity_unit: CONTRACTS
    min_qty: "0.01"             # minSz 0.01 contracts = 0.0001 BTC
    qty_step: "0.01"            # lotSz
    quote_currency: USDT
    cost_profile: crypto_perp_binance
    verified_on: "2026-10-06"
    source: https://raw.githubusercontent.com/ccxt/ccxt/master/ts/src/test/static/markets/okx.json
    notes: >-
      ctType linear, ctVal 0.01 BTC, ctMult 1, settleCcy USDT, tickSz 0.1,
      lotSz = minSz = 0.01 contracts, maxMktSz 35,000 contracts, lever 100.
      Notional = contracts x 0.01 x price. Costs use crypto_perp_binance (no
      OKX profile yet).

