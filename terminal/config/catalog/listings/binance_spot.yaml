# Binance Spot. Filters from GET /api/v3/exchangeInfo?symbol=…:
# PRICE_FILTER.tickSize, LOT_SIZE.minQty/stepSize/maxQty, NOTIONAL.minNotional
# (applyMinToMarket: true). Verified values come from a raw exchangeInfo
# capture in ccxt's static test fixture (taken after April 2026), confirmed by
# the verify pass. Filters change without notice — re-sync at start-up.
#
# Fees (assumption, crypto_spot_taker): regular user 0.10 % maker and taker,
# 25 % less when paid in BNB.
#
# Rows marked "spec unverified" are listed (the pairs exist) but every number
# on them except contract_size is a PLACEHOLDER (the loader requires positive
# values): tick = the instrument's canonical tick, min/step = 1. They are
# tradable: false and never used to size or cost a trade.
# Not listed here: gold/silver (PAXGUSDT, XAUTUSDT are gold TOKENS — a
# different underlying), EURUSDT (EUR vs USDT, not EUR/USD).

venue: binance_spot

listings:
  - instrument: BTCUSD
    venue_symbol: BTCUSDT
    contract_type: SPOT
    tick_size: "0.01"
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "0.00001"
    qty_step: "0.00001"
    max_qty: "9000"
    min_notional: "5"
    quote_currency: USDT
    cost_profile: crypto_spot_taker
    verified_on: "2026-10-06"
    source: https://raw.githubusercontent.com/ccxt/ccxt/master/ts/src/test/static/markets/binance.json
    notes: >-
      PRICE_FILTER 0.01 (max price 1,000,000); LOT_SIZE 0.00001; NOTIONAL min 5
      USDT (also on market orders), max 9,000,000; MARKET_LOT_SIZE max ~162 BTC
      (dynamic); PERCENT_PRICE_BY_SIDE 0.5x-2x of the 5-minute average. Max 200
      open orders, 5 algo orders.

  - instrument: SOLUSD
    venue_symbol: SOLUSDT
    contract_type: SPOT
    tick_size: "0.01"
    contract_size: "1"
    quantity_unit: BASE_UNITS
