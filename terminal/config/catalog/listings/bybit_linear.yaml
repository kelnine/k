      maxOrderQty 500, maxMktOrderQty 250, minNotionalValue 5, maxLeverage
      150, fundingInterval 240 min (4 h — profile assumes 8 h), launched
      2026-03-09 (the announcement's 75x is out of date). Not the older
      XAUTUSDT token perp. Evidence: verbatim instruments-info row in
      github.com/tejashendre/AI-paper-trading-agent
      docs/BYBIT_ALL_ASSETS_MARKET_EVIDENCE_2026-10-01.json (assets[6]).

