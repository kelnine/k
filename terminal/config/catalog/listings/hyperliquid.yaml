# Hyperliquid perpetuals: USDC-margined, quantity in base units, minimum order
# value $10 notional (a reduce-only order that exactly closes is exempt).
# Specs from POST /info {"type": "meta"} (main dex) and {"type": "meta",
# "dex": "xyz"} (trade.xyz HIP-3 markets).
#
# TICK: Hyperliquid has NO fixed tick. A price may have at most 5 significant
# figures and at most (6 − szDecimals) decimals; integer prices are always
# valid. tick_size below is the EFFECTIVE tick at the price level noted on
# each row — an adapter must apply the rule to the live price (e.g. SOL ticks
# 0.001 at $10-99.99 but 0.01 at $100-999.99). qty_step = 10^-szDecimals.
#
# Verified rows: BTC, SOL, HYPE from the ccxt static snapshot of meta
# (szDecimals) and recorded fills; xyz:* rows from live xyz meta dumps
# (2026-10-02 / 2026-10-06) supplied by the verify pass.
#
# Costs (crypto_perp_hyperliquid, ASSUMPTION): tier-0 main-dex fees 0.015 %
# maker / 0.045 % taker; funding hourly at 1/8 of the 8 h baseline.
# trade.xyz HIP-3 markets differ: standard HIP-3 fees are 2x core (0.03 % /
# 0.09 %), growth-mode markets ~90 % lower (~0.003 % / 0.009 %), and funding is
# scaled by 0.5 — see each row. Margin modes (isolated-only on some xyz
# markets) are not modelled.

venue: hyperliquid

listings:
  # ── main-dex crypto perps ──────────────────────────────────────────────────
  - instrument: BTCUSD
    venue_symbol: BTC
    contract_type: PERPETUAL
    tick_size: "1"              # effective tick at BTC >= $10,000 (integers always valid)
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "0.00001"
    qty_step: "0.00001"         # szDecimals 5
    min_notional: "10"
    quote_currency: USDC
    cost_profile: crypto_perp_hyperliquid
    verified_on: "2026-10-06"
    source: https://raw.githubusercontent.com/ccxt/ccxt/master/ts/src/test/static/markets/hyperliquid.json
    notes: >-
      Perp asset index 0, szDecimals 5, maxLeverage 40 in the snapshot. Price
      rule gives a $1 effective tick at BTC >= $10,000. On-chain venue: no KYC
      broker relationship — check permissibility.

  - instrument: SOLUSD
