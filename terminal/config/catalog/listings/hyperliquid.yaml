    contract_type: PERPETUAL
    tick_size: "0.001"          # effective tick at $10-99.99 (0.01 at $100-999.99)
    contract_size: "1"
    quantity_unit: BASE_UNITS
    min_qty: "0.01"
    qty_step: "0.01"            # szDecimals 2
    min_notional: "10"
    quote_currency: USDC
    cost_profile: crypto_perp_hyperliquid
    verified_on: "2026-10-06"
    source: https://raw.githubusercontent.com/ccxt/ccxt/master/ts/src/test/static/markets/hyperliquid.json
    notes: >-
      Perp asset index 5, szDecimals 2, maxLeverage 20 in the snapshot (price
      precision 0.001 at an oracle price ~$80.76). ABOVE $100 the effective
      tick is 0.01 — the adapter must apply the 5-significant-figure rule.

