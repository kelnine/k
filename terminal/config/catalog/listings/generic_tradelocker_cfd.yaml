  # ── crypto CFDs (unverified; no fitting cost profile) ──────────────────────
  - instrument: BTCUSD
    venue_symbol: BTCUSD
    contract_type: CFD
    tradable: false
    tick_size: "0.01"          # research (low confidence)
    contract_size: "1"         # research (low confidence): 1 lot = 1 BTC
    quantity_unit: LOTS
    min_qty: "0.01"            # research (low confidence)
    qty_step: "0.01"           # research (low confidence)
    quote_currency: USD
    source: https://fxnx.com/en/blog/btcusd-cfd-contract-specs-lot-size-margin-weekend-swap
    notes: >-
      spec unverified — enable after syncing from the venue API (TradeLocker
      instrument details). Also needs a crypto-CFD cost profile (% commission
      plus 7-day swap).

  - instrument: SOLUSD
    venue_symbol: SOLUSD
