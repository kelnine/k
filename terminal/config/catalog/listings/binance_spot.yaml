    qty_step: "0.001"
    max_qty: "90000"
    min_notional: "5"
    quote_currency: USDT
    cost_profile: crypto_spot_taker
    verified_on: "2026-10-06"
    source: https://raw.githubusercontent.com/ccxt/ccxt/master/ts/src/test/static/markets/binance.json
    notes: >-
      PRICE_FILTER 0.01 (max 10,000); LOT_SIZE 0.001; NOTIONAL min 5 USDT,
      max 9,000,000; MARKET_LOT_SIZE max ~74k (dynamic).

