  # ── CME futures (continuous front month) ───────────────────────────────────
  # venue_symbol is the continuous series (what Pine alerts carry);
  # symbol_format renders the dated contract for a date: CME_MINI:MNQZ2026.
  # Alerts on MNQ1! must be mapped to the dated contract by the execution
  # adapter (venue_symbol_for does that from the roll rule).
  - instrument: MNQ
    venue_symbol: "CME_MINI:MNQ1!"
    contract_type: FUTURE
    tradable: false
    tick_size: "0.25"
    contract_size: "2"
    quantity_unit: CONTRACTS
    min_qty: "1"
    qty_step: "1"
    quote_currency: USD
    symbol_format: "CME_MINI:{root}{code}{yyyy}"
    source: https://www.tradingview.com/support/solutions/43000483493-what-are-1-and-2-continuous-futures-contracts/
    notes: >-
      Continuous front-month Micro E-mini Nasdaq-100 (data). 1! switches on a
      volume crossover, not a calendar date; back-adjustment (B-ADJ) is off by
      default, so the series has roll gaps. CME_MINI:MNQ2! is the second
      contract (not aliased). Exchange session America/Chicago 17:00-16:00.
      Daily bars may use settlement as the close.

  - instrument: NQ
    venue_symbol: "CME_MINI:NQ1!"
    contract_type: FUTURE
    tradable: false
    tick_size: "0.25"
    contract_size: "20"
    quantity_unit: CONTRACTS
    min_qty: "1"
    qty_step: "1"
    quote_currency: USD
    symbol_format: "CME_MINI:{root}{code}{yyyy}"
    source: https://www.tradingview.com/support/solutions/43000483493-what-are-1-and-2-continuous-futures-contracts/
    notes: >-
      Continuous front-month E-mini Nasdaq-100 (data); dated form
      CME_MINI:NQZ2026. Volume-based roll, back-adjustment off by default.

